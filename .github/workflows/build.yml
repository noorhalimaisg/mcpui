name: Build desktop installers

# Build on every push to main, and whenever a version tag like v1.0.0 is pushed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}   # allows manual runs from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]   # the two cloud runners
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build installer
        # Unsigned builds for now. Disabling auto-discovery stops electron-builder
        # from trying (and failing) to sign on the macOS runner.
        # --publish never: only build here. Publishing to a Release is handled by
        # the separate `release` job below; without this, electron-builder tries
        # to auto-publish on CI and fails demanding a GH_TOKEN.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage

  # When a version tag is pushed, also publish the installers to a GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
